<script>
  /* Runs before the page appears. Turns on animations, and if you arrived
     through a bubble, covers the page so the bubble can pop. Keep this on every page. */
  (function (d) {
    d.classList.add("js");
    try {
      var c = sessionStorage.getItem("kv-bubble");
      if (c && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        d.classList.add("is-arriving");
        d.style.setProperty("--arrive", "var(--" + c + ")");
      } else if (c) { sessionStorage.removeItem("kv-bubble"); }
    } catch (e) {}
  })(document.documentElement);
</script>
