<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gumball favicon in berry #C2418F (the berry color token). Highlight and shadow are mixed from the berry base. -->
  <defs>
    <radialGradient id="ball" cx="50%" cy="50%" r="55%" fx="32%" fy="28%">
      <stop offset="0" stop-color="#EDC6DD"/>
      <stop offset=".42" stop-color="#C2418F"/>
      <stop offset="1" stop-color="#922D82"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#ball)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#922D82" stroke-opacity=".4" stroke-width="2"/>
</svg>
